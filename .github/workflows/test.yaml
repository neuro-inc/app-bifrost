on:
  workflow_call: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}
      - name: Install Poetry
        run: pip install poetry
      - name: Setup Python dependencies cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-
      - name: Install dependencies
        run: make install
      - name: Lint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          make lint
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install Poetry
        run: pip install poetry
      - name: Setup Python dependencies cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-
      - name: Install dependencies
        run: make setup
      - name: Run unit tests
        run: make test-unit
  test-helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install Poetry
        run: pip install poetry
      - name: Install helm
        uses: azure/setup-helm@v5
      - name: Install dependencies
        run: make setup
      - name: Lint and render the chart
        run: make test-helm
      - name: Render the chart with generated values
        run: make test-chart

  check:
    name: Check
    needs:
      - lint
      - test-unit
      - test-helm
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
